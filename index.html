<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdulrahman & Nadine's Wedding Invitation</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gold: #c5a059;
            --accent-gold: #e6c875;
            --dark-gold: #9a7635;
            --bg-cream: #faf7f2;
            --text-main: #2c2c2c;
            --text-muted: #666666;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #121212;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Container Frame */
        .mobile-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-cream);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* Splash Screen overlay */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2417 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--primary-gold);
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .splash-content {
            border: 1px solid var(--primary-gold);
            padding: 40px 25px;
            border-radius: 15px;
            background: rgba(0,0,0,0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
        }

        .splash-title {
            font-family: 'Alex Brush', cursive;
            font-size: 3.2rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        .splash-subtitle {
            font-family: 'Cinzel', serif;
            letter-spacing: 3px;
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .btn-open {
            background: linear-gradient(45deg, var(--dark-gold), var(--accent-gold));
            color: #000;
            border: none;
            padding: 14px 35px;
            font-size: 1rem;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 200, 117, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-open:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(230, 200, 117, 0.6);
        }

        /* Main Invitation */
        .invitation-wrapper {
            padding: 30px 20px 50px 20px;
            text-align: center;
            background: url('https://www.transparenttextures.com/patterns/cream-paper.png');
        }

        .header-names {
            font-family: 'Alex Brush', cursive;
            font-size: 3.5rem;
            color: var(--dark-gold);
            margin-top: 15px;
            line-height: 1.1;
        }

        .sub-header {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Couple Image Card */
        .image-card {
            position: relative;
            margin: 20px auto 35px auto;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid var(--primary-gold);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 100%;
        }

            display: block
